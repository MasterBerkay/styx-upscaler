; Styx: Master of Shadows - FSR 4 / DLSS upscaler (ReShade add-on) settings

[Upscaler]
; 1 = FSR 4 / DLSS / XeSS (picked in OptiScaler.ini) replaces the game's anti-aliasing, 0 = off at start
Enabled=1
; Toggles the upscaler in game together with Ctrl+Shift.
; Home, End, Insert, Delete, PageUp, PageDown, F1..F12, or a single letter/digit
ToggleKey=Home

[Latency]
; How many frames the CPU may prepare ahead of the GPU (Windows default 3). 1 = lowest input latency,
; 0 = leave the game's setting. Combine with AMD Anti-Lag or NVIDIA Low Latency Mode in the driver.
MaxFrameLatency=1

[Debug]
; 1 = developer hotkeys (debug views, bypass, benchmark) and performance statistics in ReShade.log
DeveloperMode=0

; Styx: Master of Shadows - FSR 4 / DLSS upscaler (ReShade add-on) settings

[Upscaler]
; 1 = FSR 4 / DLSS / XeSS (picked in OptiScaler.ini) replaces the game's anti-aliasing, 0 = off at start
Enabled=1
; Toggles the upscaler in game together with Ctrl+Shift.
; Home, End, Insert, Delete, PageUp, PageDown, F1..F12, or a single letter/digit
ToggleKey=Home
; Cycles the render resolution live, together with Ctrl+Shift:
; Native AA (100%) -> Quality (67%) -> Balanced (59%) -> Performance (50%). Saved for the next start.
QualityKey=PageUp

[Latency]
; 1 = AMD Anti-Lag 2 on Radeon GPUs (driver 24.6.1 or newer), 0 = off
AntiLag2=1
; Used when Anti-Lag 2 is off or unavailable (NVIDIA, Intel): how many frames the CPU may prepare ahead
; of the GPU (Windows default 3). 1 = lowest input latency, 0 = leave the game's setting.
; On NVIDIA also enable Low Latency Mode in the NVIDIA Control Panel.
MaxFrameLatency=1

[Debug]
; 1 = developer hotkeys (debug views, bypass, benchmark) and performance statistics in ReShade.log
DeveloperMode=0
